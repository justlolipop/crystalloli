<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal preview</title>
<!-- Shown inside another website (the order system's Production page): that page sends the
     order's crystal rows, and this draws each one on its Crystal Studio template. -->
<style>
  :root { color-scheme: light; --bg: transparent; --text: #1d1f20; --muted: #6b6f75; --line: #d4d6da; --tile: #ffffff; --accent: #45688a; --warn: #b45309; }
  :root[data-theme="dark"] { color-scheme: dark; --text: #e4ebff; --muted: #9aa8cc; --line: #22304f; --tile: #0b1222; --accent: #2f8bff; --warn: #f2b35b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  .msg { color: var(--muted); padding: 8px 0; margin: 0; }
  .msg.warn, .warn { color: var(--warn); }
  .muted { color: var(--muted); font-weight: 400; }
  /* one tab per crystal design, like the order website's own tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab { font: inherit; font-size: 13px; font-weight: 700; padding: 10px 18px; border: 0; border-radius: 3px;
    background: none; color: var(--text); cursor: pointer; letter-spacing: .02em; }
  .tab span { opacity: .6; font-weight: 400; margin-left: 4px; }
  .tab.missing { color: var(--warn); }
  .tab.on { background: var(--accent); color: #fff; box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 45%, transparent); }
  /* one crystal at a time */
  .vhead { margin-bottom: 8px; font-size: 13px; }
  .vhead .edit { margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .vhead .edit:hover { text-decoration: underline; }
  .vrow { display: flex; align-items: center; gap: 12px; }
  .stage { flex: 1; height: 400px; display: flex; align-items: center; justify-content: center; overflow: auto;
    background: var(--tile); border: 1px solid var(--line); border-radius: 6px; }
  .stage.zoomed { display: block; text-align: center; }
  .stage img { display: inline-block; max-width: none; cursor: zoom-in; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  .stage.zoomed img { cursor: zoom-out; margin: 10px; }
  .nav { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--tile);
    color: var(--text); font-size: 24px; line-height: 1; cursor: pointer; }
  .nav:disabled { opacity: .3; cursor: default; }
  .vfoot { display: flex; align-items: center; gap: 16px; margin: 8px 56px 0; font-size: 12px; color: var(--muted); }
  .vfoot .cap { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zoom { display: inline-flex; align-items: center; gap: 6px; }
  .zoom button { font: inherit; width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--tile); color: var(--text); cursor: pointer; }
  .vfoot label { cursor: pointer; }
</style>
</head>
<body>
<div class="tabs" id="tabs" hidden></div>
<div id="out"><p class="msg">Waiting for the order…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module" src="js/preview.js"></script>
</body>
</html>
